<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Đối Soát Dữ Liệu 2 Chiều</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .global-config {
            background-color: #e9ecef;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #6c757d;
        }
        .global-config label {
            display: inline-block;
            margin-bottom: 0;
            margin-right: 15px;
            font-weight: 700;
        }
        .global-config input {
            width: 300px;
            display: inline-block;
        }
        .panels-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .side-panel {
            flex: 1;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .side-panel h3 {
            margin-top: 0;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .side-panel.side-2 h3 {
            color: #e83e8c;
            border-bottom-color: #e83e8c;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95em;
        }
        select, input[type="file"], input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        button.compare-btn {
            background-color: #28a745;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button.compare-btn:hover { background-color: #218838; }
        
        .msg { padding: 15px; border-radius: 6px; margin-top: 20px; display: none; text-align: center; font-weight: 500; }
        .msg.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        .results-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            display: none;
        }
        .result-box {
            flex: 1;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .result-box h4 { margin-top: 0; font-size: 1.1em; }
        .res-1 { border-top: 4px solid #007bff; }
        .res-1 h4 { color: #007bff; }
        .res-2 { border-top: 4px solid #e83e8c; }
        .res-2 h4 { color: #e83e8c; }
