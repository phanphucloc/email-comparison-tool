<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Đối Soát Dữ Liệu 2 Chiều Nâng Cao</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif; margin: 0; padding: 0;
            background-color: #f0f2f5; color: #333; min-height: 100vh; padding: 40px 20px;
        }
        .container {
            background-color: #ffffff; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 1200px; margin: 0 auto;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        
        .global-config {
            background-color: #e9ecef; padding: 20px; border-radius: 8px;
            margin-bottom: 25px; border-left: 4px solid #6c757d;
        }
        .global-config .form-group { margin-bottom: 15px; }
        .global-config .form-group:last-child { margin-bottom: 0; }
        .global-config label { font-weight: 700; margin-right: 15px; }
        .global-config input[type="text"] { width: 300px; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
        .checkbox-label { font-weight: normal !important; cursor: pointer; display: flex; align-items: center; }
        .checkbox-label input { margin-right: 8px; transform: scale(1.2); cursor: pointer; }

        .panels-wrapper { display: flex; gap: 20px; margin-bottom: 30px; }
        .side-panel { flex: 1; background-color: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; }
        .side-panel h3 { margin-top: 0; padding-bottom: 10px; margin-bottom: 20px; }
        .side-panel.side-1 h3 { color: #007bff; border-bottom: 2px solid #007bff; }
        .side-panel.side-2 h3 { color: #e83e8c; border-bottom: 2px solid #e83e8c; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .name-input { background-color: #fff; font-weight: bold; color: #495057; border-left: 3px solid #007bff !important; }
        .side-2 .name-input { border-left-color: #e83e8c !important; }

        select, input[type="file"], input[type="text"], textarea {
            width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; font-family: monospace; }
        
        button.compare-btn {
            background-color: #28a745; color: white; padding: 15px; border: none;
            border-radius: 8px; cursor: pointer; font-size: 1.2em; font-weight: bold; width: 100%; transition: 0.3s;
        }
        button.compare-btn:hover { background-color: #218838; }
        
        .msg { padding: 15px; border-radius: 6px; margin-top: 20px; display: none; text-align: center; font-weight: 500; }
        .msg.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        .results-wrapper { display: flex; gap: 20px; margin-top: 30px; display: none; flex-direction: column; }
        .result-box { background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; overflow: hidden; }
        .res-1 { border-top: 4px solid #007bff; }
        .res-2 { border-top: 4px solid #e83e8c; }
        .result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .result-header h4 { margin: 0; font-size: 1.15em; color: #333; line-height: 1.5; flex: 1; }
        .highlight-name { text-decoration: underline; text-underline-offset: 4px; }
        .res-1 .highlight-name { color: #007bff; }
        .res-2 .highlight-name { color: #e83e8c; }
        
        .export-btn {
            background-color: #17a2b8; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-weight: 600; display: none; white-space: nowrap;
        }
        .export-btn:hover { background-color: #138496; }
        
        .table-container { max-height: 400px; overflow: auto; border: 1px solid #dee2e6; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9em; }
        th { position: sticky; top: 0; background-color: #e9ecef; border-bottom: 2px solid #dee2e6; padding: 10px; font-weight: 600; z-index: 1; white-space: nowrap; }
        td { padding: 8px 10px; border-bottom: 1px solid #e9ecef; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #f1f3f5; }

        @media (max-width: 768px) { .panels-wrapper { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Công Cụ Đối Soát Dữ Liệu 2 Chiều 🔄</h1>
    <p class="subtitle">Tìm ra sự khác biệt thông minh (Bao gồm xuất toàn bộ dữ liệu đối tượng)</p>

    <div class="global-config">
        <div class="form-group">
            <label for="global-field">Tên cột (Field Name) làm chuẩn so sánh:</label>
            <input type="text" id="global-field" placeholder="Ví dụ: email, id, username..." value="email">
        </div>
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="show-only-field-cb">
                Chỉ xuất cột dữ liệu so sánh (Bỏ tick để xuất toàn bộ thông tin/cột của dòng dữ liệu)
            </label>
        </div>
    </div>

    <div class="panels-wrapper">
        <div class="side-panel side-1">
            <h3>Dữ liệu Bên 1</h3>
            <div class="input-group">
                <label>Tên tập dữ liệu (Hiển thị ở kết quả):</label>
                <input type="text" id="name-1" class="name-input" value="Dữ liệu 1" placeholder="Nhập tên dễ nhớ...">
            </div>
            <div class="input-group">
                <label>Nguồn dữ liệu:</label>
                <select id="type-1" onchange="toggleInputs('1')">
                    <option value="csv-file">Tải lên file CSV</option>
                    <option value="json-file">Tải lên file JSON</option>
                    <option value="json-text">Nhập JSON thủ công</option>
                </select>
            </div>
            <div class="input-group" id="file-wrap-1"><input type="file" id="file-1"></div>
            <div class="input-group" id="text-wrap-1" style="display: none;"><textarea id="text-1" placeholder='[{"email": "user1@abc.com", "name": "A"}]'></textarea></div>
        </div>

        <div class="side-panel side-2">
            <h3>Dữ liệu Bên 2</h3>
            <div class="input-group">
                <label>Tên tập dữ liệu (Hiển thị ở kết quả):</label>
                <input type="text" id="name-2" class="name-input" value="Dữ liệu 2" placeholder="Nhập tên dễ nhớ...">
            </div>
            <div class="input-group">
                <label>Nguồn dữ liệu:</label>
                <select id="type-2" onchange="toggleInputs('2')">
                    <option value="json-text">Nhập JSON thủ công</option>
                    <option value="csv-file">Tải lên file CSV</option>
                    <option value="json-file">Tải lên file JSON</option>
                </select>
            </div>
            <div class="input-group" id="file-wrap-2" style="display: none;"><input type="file" id="file-2"></div>
            <div class="input-group" id="text-wrap-2"><textarea id="text-2" placeholder='[{"email": "user2@abc.com", "phone": "0123"}]'></textarea></div>
        </div>
    </div>

    <button class="compare-btn" onclick="executeComparison()">🚀 Bắt Đầu Phân Tích & So Sánh</button>
    <div id="msg-box" class="msg"></div>

    <div class="results-wrapper" id="results-wrapper">
        <div class="result-box res-1">
            <div class="result-header">
                <h4 id="title-res-1">🔵 Có ở Bên 1 nhưng KHÔNG có ở Bên 2 (<span id="count-1">0</span>)</h4>
                <button class="export-btn" id="export-1" onclick="exportCSV('1')">📥 Xuất CSV</button>
            </div>
            <div class="table-container" id="table-wrap-1"></div>
        </div>
        
        <div class="result-box res-2">
            <div class="result-header">
                <h4 id="title-res-2">🔴 Có ở Bên 2 nhưng KHÔNG có ở Bên 1 (<span id="count-2">0</span>)</h4>
                <button class="export-btn" id="export-2" onclick="exportCSV('2')">📥 Xuất CSV</button>
            </div>
            <div class="table-container" id="table-wrap-2"></div>
        </div>
    </div>
</div>

<script>
    // Tự động lấy tên file điền vào ô Tên tập dữ liệu
    document.getElementById('file-1').addEventListener('change', function(e) {
        if(e.target.files.length > 0) {
            document.getElementById('name-1').value = e.target.files[0].name;
        }
    });

    document.getElementById('file-2').addEventListener('change', function(e) {
        if(e.target.files.length > 0) {
            document.getElementById('name-2').value = e.target.files[0].name;
        }
    });

    // Dữ liệu toàn cục để Export
    let finalResult1 = [];
    let finalResult2 = [];
    let currentField = '';
    let isOnlyFieldMode = false;

    function toggleInputs(side) {
        const type = document.getElementById(`type-${side}`).value;
        const fileWrap = document.getElementById(`file-wrap-${side}`);
        const textWrap = document.getElementById(`text-wrap-${side}`);
        const fileInput = document.getElementById(`file-${side}`);

        if (type === 'csv-file') {
            fileWrap.style.display = 'block'; textWrap.style.display = 'none'; fileInput.accept = ".csv,.txt";
        } else if (type === 'json-file') {
            fileWrap.style.display = 'block'; textWrap.style.display = 'none'; fileInput.accept = ".json";
        } else if (type === 'json-text') {
            fileWrap.style.display = 'none'; textWrap.style.display = 'block';
        }
    }

    function readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = e => reject(e);
            reader.readAsText(file);
        });
    }

    function parseCSV(csvText, fieldName) {
        const lines = csvText.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
        if (lines.length === 0) return [];
        if (lines[0].includes(',')) {
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((h, i) => { obj[h] = values[i] ? values[i].trim() : ''; });
                return obj;
            });
        } else {
            return lines.map(line => ({ [fieldName]: line.trim() }));
        }
    }

    function parseJSON(jsonString) {
        let parsedArray;
        jsonString = jsonString.trim();
        if (!jsonString) return [];
        if (jsonString.startsWith('[') && jsonString.endsWith(']')) {
            parsedArray = JSON.parse(jsonString);
        } else {
            parsedArray = JSON.parse(`[${jsonString.replace(/}\s*,\s*{/g, '},{')}]`);
        }
        if (!Array.isArray(parsedArray)) throw new Error("JSON không hợp lệ.");
        return parsedArray;
    }

    async function getSideDataObjects(side, fieldName) {
        const type = document.getElementById(`type-${side}`).value;
        const sideName = document.getElementById(`name-${side}`).value.trim() || `Bên ${side}`;
        let objects = [];

        if (type === 'csv-file') {
            const file = document.getElementById(`file-${side}`).files[0];
            if (!file) throw new Error(`Vui lòng chọn file CSV cho ${sideName}`);
            const text = await readFileAsText(file);
            objects = parseCSV(text, fieldName);
        } else if (type === 'json-file') {
            const file = document.getElementById(`file-${side}`).files[0];
            if (!file) throw new Error(`Vui lòng chọn file JSON cho ${sideName}`);
            const text = await readFileAsText(file);
            objects = parseJSON(text);
        } else if (type === 'json-text') {
            const text = document.getElementById(`text-${side}`).value;
            if (!text.trim()) throw new Error(`Vui lòng dán JSON cho ${sideName}`);
            objects = parseJSON(text);
        }

        const seen = new Set();
        return objects.filter(obj => {
            if (!obj || typeof obj !== 'object') return false;
            const val = obj[fieldName];
            if (val === undefined || val === null || String(val).trim() === '') return false; 
            
            const lowerVal = String(val).trim().toLowerCase();
            if (seen.has(lowerVal)) return false;
            seen.add(lowerVal);
            return true;
        });
    }

    function showMsg(type, text) {
        const msgBox = document.getElementById('msg-box');
        msgBox.className = `msg ${type}`;
        msgBox.textContent = text;
        msgBox.style.display = 'block';
    }

    function renderDynamicTable(containerId, dataArr) {
        const container = document.getElementById(containerId);
        
        if (dataArr.length === 0) {
            container.innerHTML = '<table><tr><td style="text-align:center; color:#28a745; font-weight:bold; padding: 20px;">✅ Không có sự khác biệt (Dữ liệu khớp nhau hoàn toàn)</td></tr></table>';
            return;
        }

        let theadHTML = '';
        let tbodyHTML = '';

        if (isOnlyFieldMode) {
            theadHTML = `<tr><th style="width: 50px; text-align: center;">STT</th><th>${currentField}</th></tr>`;
            dataArr.forEach((item, index) => {
                tbodyHTML += `<tr><td style="text-align: center;">${index + 1}</td><td>${item[currentField]}</td></tr>`;
            });
        } else {
            let allKeys = [];
            dataArr.forEach(item => {
                Object.keys(item).forEach(k => { if (!allKeys.includes(k)) allKeys.push(k); });
            });
            allKeys = allKeys.filter(k => k !== currentField);
            allKeys.unshift(currentField);

            let ths = `<th style="width: 50px; text-align: center;">STT</th>`;
            allKeys.forEach(k => ths += `<th>${k}</th>`);
            theadHTML = `<tr>${ths}</tr>`;

            dataArr.forEach((item, index) => {
                let tds = `<td style="text-align: center;">${index + 1}</td>`;
                allKeys.forEach(k => {
                    let val = item[k];
                    if (typeof val === 'object' && val !== null) val = JSON.stringify(val);
                    tds += `<td title="${val || ''}">${val || ''}</td>`;
                });
                tbodyHTML += `<tr>${tds}</tr>`;
            });
        }

        container.innerHTML = `<table><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
    }

    function exportCSV(side) {
        const dataArr = side === '1' ? finalResult1 : finalResult2;
        if (dataArr.length === 0) return;

        // Lấy tên để đặt cho file tải xuống
        let baseName = document.getElementById(`name-${side}`).value.trim() || `Ben_${side}`;
        // Dọn dẹp tên file để tránh lỗi hệ điều hành (thay khoảng trắng bằng _, bỏ ký tự đặc biệt)
        let safeFileName = baseName.replace(/[^a-z0-9]/gi, '_').toLowerCase();

        let csvContent = "";
        
        if (isOnlyFieldMode) {
            csvContent = `"${currentField}"\n` + dataArr.map(item => `"${String(item[currentField]).replace(/"/g, '""')}"`).join('\n');
        } else {
            let allKeys = [];
            dataArr.forEach(item => {
                Object.keys(item).forEach(k => { if (!allKeys.includes(k)) allKeys.push(k); });
            });
            allKeys = allKeys.filter(k => k !== currentField);
            allKeys.unshift(currentField);

            csvContent += allKeys.map(k => `"${k}"`).join(',') + '\n';
            dataArr.forEach(item => {
                const row = allKeys.map(k => {
                    let val = item[k];
                    if (typeof val === 'object' && val !== null) val = JSON.stringify(val);
                    return `"${String(val || '').replace(/"/g, '""')}"`;
                });
                csvContent += row.join(',') + '\n';
            });
        }

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Ket_Qua_${safeFileName}.csv`;
        link.click();
    }

    async function executeComparison() {
        document.getElementById('msg-box').style.display = 'none';
        document.getElementById('results-wrapper').style.display = 'none';

        try {
            currentField = document.getElementById('global-field').value.trim();
            isOnlyFieldMode = document.getElementById('show-only-field-cb').checked;

            if (!currentField) throw new Error("Vui lòng nhập Tên cột (Field Name) để làm chuẩn so sánh!");

            // Lấy tên động
            const name1 = document.getElementById('name-1').value.trim() || 'Dữ liệu 1';
            const name2 = document.getElementById('name-2').value.trim() || 'Dữ liệu 2';

            const objList1 = await getSideDataObjects('1', currentField);
            const objList2 = await getSideDataObjects('2', currentField);

            if (objList1.length === 0 && objList2.length === 0) {
                throw new Error(`Không tìm thấy dữ liệu nào chứa cột "${currentField}" để so sánh.`);
            }

            const set1 = new Set(objList1.map(obj => String(obj[currentField]).toLowerCase()));
            const set2 = new Set(objList2.map(obj => String(obj[currentField]).toLowerCase()));

            finalResult1 = objList1.filter(obj => !set2.has(String(obj[currentField]).toLowerCase()));
            finalResult2 = objList2.filter(obj => !set1.has(String(obj[currentField]).toLowerCase()));

            // CẬP NHẬT GIAO DIỆN (TIÊU ĐỀ ĐỘNG)
            document.getElementById('title-res-1').innerHTML = `🔵 Có ở <strong class="highlight-name">${name1}</strong> nhưng KHÔNG có ở <strong class="highlight-name">${name2}</strong> (<span id="count-1">${finalResult1.length}</span>)`;
            document.getElementById('title-res-2').innerHTML = `🔴 Có ở <strong class="highlight-name">${name2}</strong> nhưng KHÔNG có ở <strong class="highlight-name">${name1}</strong> (<span id="count-2">${finalResult2.length}</span>)`;

            // Nút Export cũng có tên rõ ràng
            const btnExp1 = document.getElementById('export-1');
            const btnExp2 = document.getElementById('export-2');
            
            btnExp1.textContent = `📥 Xuất CSV (${name1})`;
            btnExp2.textContent = `📥 Xuất CSV (${name2})`;

            btnExp1.style.display = finalResult1.length > 0 ? 'block' : 'none';
            btnExp2.style.display = finalResult2.length > 0 ? 'block' : 'none';

            renderDynamicTable('table-wrap-1', finalResult1);
            renderDynamicTable('table-wrap-2', finalResult2);

            // Vì Tiêu đề có thể dài, mình đổi flex-direction của wrapper thành column cho dễ nhìn
            document.getElementById('results-wrapper').style.display = 'flex';
            showMsg('success', '✅ Phân tích và so sánh hoàn tất!');

        } catch (error) {
            console.error(error);
            showMsg('error', '❌ ' + error.message);
        }
    }

    window.onload = function() { toggleInputs('1'); toggleInputs('2'); };
</script>
</body>
</html>
