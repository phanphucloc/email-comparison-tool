<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ So Sánh Dữ Liệu Linh Hoạt</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 90%;
            margin-bottom: 40px;
        }
        h1, h2 {
            color: #d9534f; /* Màu đỏ nổi bật cho công cụ linh hoạt */
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
        }
        p {
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #555;
            font-size: 1.1em;
        }
        input[type="file"], input[type="text"] {
            display: block;
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            background-color: #f8f9fa;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        input[type="file"]:hover, input[type="text"]:hover {
            border-color: #d9534f;
        }
        textarea {
            width: calc(100% - 22px);
            height: 200px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            resize: vertical;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95em;
            line-height: 1.5;
            transition: border-color 0.3s ease;
        }
        textarea:focus {
            border-color: #d9534f;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(217, 83, 79, 0.25);
        }
        button {
            background-color: #5cb85c; /* Màu xanh lá cây */
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 500;
            display: block;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #4cae4c;
            transform: translateY(-2px);
        }
        .result-section {
            margin-top: 35px;
            padding: 20px;
            background-color: #fff0f0; /* Màu hồng nhạt cho kết quả */
            border-radius: 10px;
            border: 1px solid #ebcccc;
            display: none;
        }
        .result-section h2 {
            color: #d9534f;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        #result-count {
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1em;
        }
        #result-list {
            list-style-type: decimal;
            padding-left: 25px;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #ebcccc;
            border-radius: 8px;
            padding-top: 10px;
            padding-bottom: 10px;
            background-color: #ffffff;
        }
        #result-list li {
            padding: 8px 0;
            border-bottom: 1px dashed #e9ecef;
            word-wrap: break-word;
        }
        #result-list li:last-child {
            border-bottom: none;
        }
        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .success-message {
            color: #5cb85c; 
            background-color: #dff0d8;
            border: 1px solid #d0e9c6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Công Cụ So Sánh Dữ Liệu Linh Hoạt ✨</h1>
        
        <p>So sánh các giá trị từ file CSV với các giá trị trong mảng JSON dựa trên tên cột được chỉ định.</p>

        <div class="input-group">
            <label for="csvFileInput">1. Tải lên file CSV (danh sách giá trị để so sánh, mỗi giá trị một dòng):</label>
            <input type="file" id="csvFileInput" accept=".csv">
        </div>

        <div class="input-group">
            <label for="fieldNameInput">2. Nhập tên cột (Field Name) trong JSON để so sánh và xuất kết quả (Ví dụ: <strong>email</strong> hoặc <strong>username</strong>):</label>
            <input type="text" id="fieldNameInput" placeholder="Ví dụ: email">
        </div>

        <div class="input-group">
            <label for="jsonInput">3. Nhập mảng JSON danh sách người dùng (chứa cột đã nhập ở bước 2):</label>
            <textarea id="jsonInput" placeholder="Ví dụ:
[
  { &quot;id&quot;: &quot;...&quot;, &quot;email&quot;: &quot;drsundevil42@gmail.com&quot;, ... },
  { &quot;id&quot;: &quot;...&quot;, &quot;email&quot;: &quot;heathersk9community@gmail.com&quot;, ... }
]"></textarea>
        </div>

        <button onclick="compareData()">So sánh Dữ liệu</button>

        <div id="status-messages">
            <p id="error-message" class="error-message"></p>
            <p id="success-message" class="success-message"></p>
        </div>

        <div id="result-section" class="result-section">
            <h2>Kết quả so sánh</h2>
            <p id="result-count"></p>
            <ul id="result-list"></ul>
        </div>
    </div>

    <script>
        // Biến toàn cục để lưu trữ dữ liệu
        let csvData = [];
        let jsonValuesToCompare = [];

        // Tham chiếu đến các phần tử DOM
        const csvFileInput = document.getElementById('csvFileInput');
        const fieldNameInput = document.getElementById('fieldNameInput');
        const jsonInput = document.getElementById('jsonInput');
        const resultSection = document.getElementById('result-section');
        const resultCount = document.getElementById('result-count');
        const resultList = document.getElementById('result-list');
        const errorMessageDiv = document.getElementById('error-message');
        const successMessageDiv = document.getElementById('success-message');

        // Hàm hiển thị thông báo
        function showMessage(type, message) {
            clearMessages();
            if (type === 'error') {
                errorMessageDiv.textContent = message;
                errorMessageDiv.style.display = 'block';
            } else if (type === 'success') {
                successMessageDiv.textContent = message;
                successMessageDiv.style.display = 'block';
            }
        }

        // Hàm ẩn tất cả thông báo
        function clearMessages() {
            errorMessageDiv.style.display = 'none';
            successMessageDiv.style.display = 'none';
        }

        // Xử lý khi file CSV được tải lên
        csvFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            clearMessages();
            resultSection.style.display = 'none';

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const csvContent = e.target.result;
                    
                    // Chuẩn hóa xuống dòng và tách dữ liệu
                    csvData = csvContent.replace(/\r/g, '\n')
                                        .split('\n')
                                        .map(item => item.trim())
                                        .filter(item => item !== '');

                    console.log("Dữ liệu từ CSV (sau xử lý):", csvData);
                    if (csvData.length > 0) {
                        showMessage('success', `Đã tải lên ${csvData.length} mục dữ liệu từ file CSV.`);
                    } else {
                        showMessage('error', 'File CSV không chứa dữ liệu hợp lệ nào.');
                    }
                };
                reader.onerror = () => {
                    showMessage('error', 'Không thể đọc file CSV. Vui lòng thử lại.');
                    csvData = [];
                };
                reader.readAsText(file);
            } else {
                csvData = [];
                showMessage('error', 'Chưa có file CSV nào được chọn.');
            }
        });

        // Hàm phân tích JSON từ input
        function parseJsonInput(fieldName) {
            const jsonString = jsonInput.value.trim();
            if (!jsonString || !fieldName) {
                return [];
            }

            try {
                let parsedArray;
                if (jsonString.startsWith('[') && jsonString.endsWith(']')) {
                    parsedArray = JSON.parse(jsonString);
                } else {
                    const cleanedString = `[${jsonString.replace(/}\s*,\s*{/g, '},{')}]`;
                    parsedArray = JSON.parse(cleanedString);
                }

                if (!Array.isArray(parsedArray)) {
                    throw new Error("Dữ liệu nhập vào không phải là một mảng JSON hợp lệ.");
                }

                // Lấy ra danh sách các giá trị từ cột (field) được chỉ định
                const values = parsedArray
                                .map(item => {
                                    const value = item?.[fieldName];
                                    return (typeof value === 'string' || typeof value === 'number') ? String(value).trim() : null;
                                })
                                .filter(value => value !== null && value !== '');
                return values;

            } catch (error) {
                console.error(`Lỗi khi phân tích JSON hoặc trường "${fieldName}":`, error);
                showMessage('error', `Lỗi định dạng JSON hoặc tên trường: ${error.message}. Vui lòng kiểm tra lại.`);
                return null; 
            }
        }

        // Hàm so sánh dữ liệu chính
        function compareData() {
            clearMessages();
            resultSection.style.display = 'none';

            const fieldName = fieldNameInput.value.trim();
            if (!fieldName) {
                showMessage('error', "Vui lòng nhập tên cột (Field Name) cần so sánh.");
                return;
            }

            if (csvData.length === 0) {
                showMessage('error', "Vui lòng tải lên file CSV trước khi so sánh.");
                return;
            }

            // Lấy dữ liệu từ JSON dựa trên tên cột
            jsonValuesToCompare = parseJsonInput(fieldName);
            if (jsonValuesToCompare === null) {
                return; // Có lỗi JSON đã được hiển thị
            }

            console.log(`Dữ liệu từ JSON (cột "${fieldName}"):`, jsonValuesToCompare);

            if (jsonValuesToCompare.length === 0 && jsonInput.value.trim()) {
                showMessage('error', `Không tìm thấy giá trị nào cho cột "${fieldName}" trong JSON đã nhập.`);
                return;
            }

            // Chuyển JSON values thành Set để tối ưu việc tìm kiếm
            const jsonValueSet = new Set(jsonValuesToCompare);

            // Tìm các giá trị có trong CSV nhưng không có trong JSON
            const dataOnlyInCsv = csvData.filter(item => !jsonValueSet.has(item));

            displayResults(dataOnlyInCsv, fieldName);
        }

        // Hàm hiển thị kết quả ra giao diện
        function displayResults(results, fieldName) {
            resultList.innerHTML = '';
            resultSection.style.display = 'block';

            if (results.length === 0) {
                resultCount.textContent = "✅ Không tìm thấy mục dữ liệu nào trong CSV mà không có trong danh sách JSON.";
                resultList.innerHTML = '<li>Tất cả các mục CSV đều khớp với các giá trị trong cột "' + fieldName + '" của JSON.</li>';
            } else {
                resultCount.textContent = `❌ Tìm thấy ${results.length} mục dữ liệu trong CSV nhưng không có trong cột "${fieldName}" của JSON:`;
                results.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.textContent = item;
                    resultList.appendChild(listItem);
                });
            }
        }
    </script>
</body>
</html>
